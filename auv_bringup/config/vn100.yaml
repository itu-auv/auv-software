# VN100 on Taluy Mini, for the ROS 2 vectornav driver (dawonn/vectornav, ros2 branch).
# Values carried over from the ROS 1 file; parameter names are the new driver's.
/**/auv_vectornav_node:
  ros__parameters:
    # Defined in udev rules, change according to your system. Typically /dev/ttyUSB0
    port: /dev/ttyUSB0
    # Acceptable baud rates : 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600
    baud: 115200
    # Acceptable data rates in Hz: 1, 2, 4, 5, 10, 20, 25, 40, 50, 100, 200
    AsyncDataOutputFrequency: 40
    frame_id: taluy_mini/base_link/imu_link

/**/auv_vectornav_sensor_msgs:
  ros__parameters:
    use_enu: true
    frame_id: taluy_mini/base_link/imu_link
    orientation_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    angular_velocity_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    linear_acceleration_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
