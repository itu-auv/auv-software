# TEKNOFEST gate (9 keypoints + aperture mask). Geometry, ids, decode:
# gate_tetra_overview.md §2.

object: gate
camera: torpedo # image/result topics, calibration, frame all derive from this (torpedo cam = gate default since 08-16: front cam weak; yildiz.launch camera:= overrides)

model: # consumed by vitpose_inference (via the detection node)
  checkpoint: gate_joint.engine # resolved against auv_detection/models/; TRT fp16 (built on the Orin from gate_joint.pth, ~/vitpose_trt)
  device: cuda
  decode: {use_udp: false, post_process: unbiased, kernel: 11} # contractual
  flip_tta: false # off for reference parity; enable only after measuring
  flip_pairs: [[0, 1], [2, 3], [5, 7]]
  keypoint_names: [FrameTL, FrameTR, FrameBR, FrameBL, MidTop, MidRight, MidBottom, MidLeft, PingerTop]
  # gate_joint (real r1, clean_real_pose_b/001) is POSE-ONLY (C=0): no aperture
  # mask; gate_pose is keypoint-only anyway. Restore [gate] for a pose+seg ckpt.
  mask_classes: []
  mask_threshold: null # null = from checkpoint (0.5)

detection: # consumed by vitpose_detection_node
  bbox_provider:
    type: model
    checkpoint: olukargagate.pth # TRT fp16 of gate_objectness.pth
    device: cuda
    threshold: 0.5 # detect
    # NOT tetra's 0.7: for gate an inflated box is nearly free (1.25x pad,
    # tracker takes over) while a tight one clips the pinger pole (kp 8).
    # Revisit with real gate footage.
    measure_threshold: null
    search_rate: null # every frame: the detector is the crop source (no tracker below)
    # The torpedo housing shows dark side arcs (800x448 rect image); the
    # detector locks onto them when no gate is in view. Detector-only crop.
    detect_columns: {torpedo: [200, 615]} # 08-17 painted housing mask (~/Shared/torpedo_cam_mask.png): no arc pixel in any row; centre row alone would allow [87, 719]
    # Topic names the OBJECT: Detection2DArray has no object field.
    publish_topic: /vitpose_bbox_gate_front
    # No `tracker:` block: objectness runs on EVERY frame and its box is the
    # crop (08-17 kapı-bag verdict: CropTracker kp-carry drifts the box aspect;
    # detector-every-frame is visibly best, affordable on TRT).

process: # consumed by vitpose_process_node
  skeleton: [[0, 4], [4, 1], [1, 5], [5, 2], [2, 6], [6, 3], [3, 7], [7, 0], [4, 8]]
  viz_conf_threshold: 0.5
  viz_masks: false # overlay: keypoints only, no aperture tint
  operations:
    # Keypoint-only 6-DOF pose (vitpose_utils SECTION 2, kp path; the mask
    # is not consumed). Object frame Z-up, +Y = plane normal, all points in
    # the y=0 plane.
    - type: gate_pose
      params:
        # Index = keypoint id 0..8.
        model_points:
          - [-0.53, 0.0, 1.49] # 0 FrameTL
          - [0.53, 0.0, 1.49] # 1 FrameTR
          - [0.53, 0.0, 0.03] # 2 FrameBR
          - [-0.53, 0.0, 0.03] # 3 FrameBL
          - [0.00, 0.0, 1.49] # 4 MidTop
          - [0.53, 0.0, 0.76] # 5 MidRight
          - [0.00, 0.0, 0.03] # 6 MidBottom
          - [-0.53, 0.0, 0.76] # 7 MidLeft
          - [0.00, 0.0, 1.59] # 8 PingerTop
        # The aperture opening, corner loop — overlay + range-gate centroid.
        aperture_polygon:
          - [-0.5, 0.0, 0.06]
          - [0.5, 0.0, 0.06]
          - [0.5, 0.0, 1.46]
          - [-0.5, 0.0, 1.46]
        plane_normal: [0.0, 1.0, 0.0]
        # Post midpoints slide along their post; perpendicular residuals only.
        slide_segments:
          5: [[0.53, 0.0, 0.3], [0.53, 0.0, 1.2]]
          7: [[-0.53, 0.0, 0.3], [-0.53, 0.0, 1.2]]
        min_keypoints: 4
        max_distance: 30.0 # house-wide range gate
        prior_timeout: 5.0 # s; last accepted pose serves as init/flip prior
        prior_distance: 3.0 # m; canonical face-on prior before first accept
        # Resolve planar-PnP's 180-degree normal ambiguity before gate_link is
        # published. Local -Y is kept on the robot side of the gate.
        robot_frame: taluy/base_link
        orientation_reference_frame: odom
        orientation_lookup_timeout: 0.5
        # refine: {} # FUSED_POSE_DEFAULTS overrides
        outputs:
          # One frame at the aperture centre — what SMACH aligns to and swims
          # through. Collides with the YOLO gate frame on purpose (one
          # pipeline at a time); rename here to run both.
          - {child_frame: gate_link, offset_xyz: [0.0, 0.0, 0.76]}

# Config-variant overlays (vitpose_utils.load_object_config): same object,
# same topics, same process — only the listed keys change. Two-level merge:
# a variant section's keys replace the base section's WHOLESALE. Selected by
# the detection node's ~variant param (yildiz.launch gate_no_detection, on by
# default) and it sticks across set_config switches; configs without the
# variant load their base.
variants:
  no_detection: # gate with no detector, just the fixed column crop
    model:
      checkpoint: gate_torpedo.engine # joint/gate/torpedo_pose_b/002, TRT fp16, input 224x208 (built on the Orin from gate_torpedo.pth, ~/vitpose_trt); trained on gate_torpedo_real2: torpedo-geometry renders + partial gates + red-pipe hard negatives
      padding: 1.0 # the fixed band below IS the crop: skip box2cs' 1.25x pad
    detection:
      bbox_provider:
        # Training-time crop contract (torpedo_models README): the model sees
        # the housing-free column band [200, 616) of the 800x448 rect frame
        # (416x448, exactly 2x the 208x224 input), fed verbatim (padding 1.0
        # above). 616, not detect_columns' 615: width must be exactly 416.
        type: fixed
        columns: {torpedo: [200, 616]}
        # No detector box exists; the provider's feedback hook publishes the
        # bounding box of keypoints scoring >= presence_threshold instead
        # (empty heartbeat otherwise) — kp scores ARE the presence signal
        # (empty water max heatmap p95 ~0.01, gate in view ~0.95).
        presence_threshold: 0.5
        publish_topic: /vitpose_bbox_gate_front
