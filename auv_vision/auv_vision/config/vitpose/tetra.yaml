# TEKNOFEST "yıldızlar" tetra (60 cm tetrahedron, 3 letter + 4 vertex
# keypoints, red/green/blue face masks, bottom camera). Geometry, chirality,
# decals: gate_tetra_overview.md §3.

object: tetra
camera: bottom # image/result topics, calibration, frame all derive from this

model:
  checkpoint: tetra_joint.engine # TRT fp16 of tetra_joint.pth (real r1, clean_real_b/001); trained WITH random chirality
  device: cuda
  decode: {use_udp: false, post_process: unbiased, kernel: 11} # contractual
  # Never flip tetra: mirrored letters don't exist and mirroring fakes the
  # chirality.
  flip_tta: false
  flip_pairs: []
  # 0-2 = letter glyph centres (per-image, not fixed 3D points) — the mission
  # payload. 3-6 = the solid's vertices, chirality-resolved names; predicted
  # but consumed by nothing yet (the hook for a real 6-DOF pose op).
  keypoint_names: [A, B, C, Apex, VertexRG, VertexGB, VertexBR]
  # Channel order contractual. The colour arrangement on the solid is NOT
  # fixed (50% mirror chirality) — associate via keypoint-in-mask only.
  mask_classes: [red, green, blue]
  mask_threshold: null

detection:
  bbox_provider:
    type: model
    checkpoint: tetra_objectness.engine # TRT fp16 of tetra_objectness.pth
    device: cuda
    threshold: 0.5 # detect
    measure_threshold: 0.7 # box EXTENT only — real ramp is wider than sim
    search_rate: null # every frame: the detector is the crop source (no tracker below)
    # Topic names the OBJECT: Detection2DArray has no object field.
    publish_topic: /vitpose_bbox_tetra_bottom
    # No `tracker:` block: objectness runs on EVERY frame and its box is the
    # crop (mask-silhouette CropTracker retired with the move to TRT, 08-19).

process:
  skeleton: [] # letters have no skeleton
  viz_conf_threshold: 0.5
  operations:
    # Letter<->face association (vitpose_utils SECTION 3). Publishes
    # tetra/letter_colors + the unfolded net.
    - type: tetra_unfold
      params:
        # PLACEHOLDER — set from the real object before the competition:
        # cyclic order of (red, green, blue) going CLOCKWISE in the
        # camera image. Only lays out the drawn net.
        chirality: cw
        min_score: 0.35 # averted-face letters are garbage; the only defence
        inside_min: 0.25 # mask prob at the kp that counts as "in this face"
        max_mask_distance_px: 40.0 # nearest-mask fallback reach
        proximity_weight: 0.6 # a near miss is worth less than a hit
        eps: 0.04 # membership floor: bounds one frame's influence
        # Swept values — rationale at TETRA_DEFAULTS (vitpose_utils).
        tau: 10.0 # s, evidence forgetting
        gain: 0.25 # per-frame log-likelihood gain
        logp_clip: 20.0 # keeps a wrong lock reversible (~1.2 s)
        lock_threshold: 0.99 # p_best needed to call it LOCKED ...
        min_evidence: 10.0 # ... together with this much evidence mass
        min_direct_evidence: 1.0 # below this a letter is flagged "inferred"
        publish_period: 0.5 # s; the String also fires immediately on change
        net_size: 480 # px, square canvas of the unfolded net
