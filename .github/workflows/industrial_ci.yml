name: industrial_ci

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: true
        type: string
      docker_image_tag:
        description: 'Docker image tag'
        required: true
        type: string

jobs:
  industrial_ci:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: make temp build directory using mktemp
        id: make_temp_build_dir
        run: |
          directory=$(mktemp -d)
          echo build_directory=$directory >> $GITHUB_ENV
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: lyrical
          UPSTREAM_WORKSPACE: third_party.repos
          TARGET_WORKSPACE: "."
          BASEDIR: ${{ steps.make_temp_build_dir.outputs.build_directory }}
          AFTER_SETUP_UPSTREAM_WORKSPACE: mv $BASEDIR/upstream_ws/third_party $BASEDIR/upstream_ws/src/; vcs pull $BASEDIR/upstream_ws/src; touch $BASEDIR/upstream_ws/src/third_party/xsens_mti_ros2_driver/src/ntrip/COLCON_IGNORE
      - name: cleanup temp build directory
        if: always()
        run: rm -rf ${{ steps.make_temp_build_dir.outputs.build_directory }}
